[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "ekko"
version = "0.2.2"
description = "Local-first, privacy-preserving meeting notetaker"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "sounddevice>=0.4.6",
    "soundfile>=0.12.1",
    "faster-whisper>=1.0.0",
    "google-genai>=0.3.0",
    "textual>=0.80",
]

[project.optional-dependencies]
# diarization (needs a Hugging Face token); enable [diarize] in config
diarize = ["pyannote.audio>=3.1"]

[project.scripts]
ekko = "ekko.cli:main"

[tool.setuptools.packages.find]
include = ["ekko*"]
