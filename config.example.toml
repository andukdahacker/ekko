# Copy to ~/.ekko/config.toml and edit.

# Where the SQLite record + audio live (on-device).
data_dir = "~/.ekko"

[capture]
audio_dir = "~/.ekko/audio"
# input_device: leave unset for the default mic (in-person).
# For ONLINE meetings, create a BlackHole+mic Aggregate Device and put its
# name or index here so one stream carries system audio + your mic.
# input_device = "Aggregate Device"

[whisper]
# "small"/"base" are the sweet spot on a 16GB M2. "large-v3" = best quality.
model_size = "small"
compute_type = "int8"

[diarize]
# Who-spoke-when. method = "local" (default) | "pyannote" | "off".
#   local    — fully on-device, no token. Uses a neural speaker-embedding model
#              (CAM++, ~28 MB, downloaded once to ~/.ekko/models) that separates a
#              single mixed stream (e.g. an online meeting) into Speaker A/B/C;
#              rename the clusters by hand afterwards. Falls back to lightweight
#              MFCC features if onnxruntime/the model isn't available.
#   pyannote — highest accuracy; needs `pip install pyannote.audio` + an HF token
#              (the model is gated), then set hf_token below.
#   off      — everyone -> "Speaker A".
method = "local"
max_speakers = 8        # ceiling on how many distinct speakers local may find
# threshold = 0.65      # advanced: lower = splits speakers more eagerly (auto if unset)
# hf_token = "hf_..."   # only for method = "pyannote"

[summarize]
# provider = "gemini" (cloud) or "local" (Ollama, fully offline). Default gemini.
provider = "gemini"

# --- provider = "gemini" (cloud) ---
# Transcript TEXT is sent to Google (audio stays local). Use a BILLING-ENABLED
# key (paid tier isn't used for training). Set GEMINI_API_KEY in the env, or here.
model = "gemini-3.6-flash"
# api_key = "..."

# --- provider = "local" (Ollama — nothing leaves the device) ---
# Install Ollama (https://ollama.com), then `ollama pull qwen2.5:7b`. Set
# provider = "local" above and use a per-provider model id (the `model` line is
# shared, so change it to the Ollama model when switching providers):
# model = "qwen2.5:7b"
# host = "http://localhost:11434"   # or set OLLAMA_HOST in the environment

[speakers]
# Optional: rename anonymous diarization clusters to real names (in-person).
# [speakers.name_map]
# "Speaker A" = "Duc"
# "Speaker B" = "Priya"

[markdown]
enabled = true
vault_dir = "~/Notes/meetings"   # point at an Obsidian vault if you use one
